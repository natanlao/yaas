name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version-file: "pyproject.toml"

    - uses: astral-sh/setup-uv@v7

    - run: uv sync

    - run: make test

